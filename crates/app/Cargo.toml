[package]
name = "ellefuanti"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "A native, GPU-accelerated IDE built for PHP, Laravel, Livewire and Blade"

[[bin]]
name = "ellefuanti"
path = "src/main.rs"

[features]
# Compile Metal shaders at runtime instead of at build time.
#
# On by default because the alternative requires **full Xcode**: gpui's build script shells
# out to `xcrun metal`, which the Command Line Tools do not ship, and the build fails
# outright without it. Defaulting to buildability means `cargo build` works on a fresh
# checkout with no 40 GB install.
#
# The cost is startup: compiling shaders at launch is ~432 ms on a cold shader cache, which
# is most of the 520 ms cold start recorded in benchmarks/BASELINE.md against a 500 ms
# budget. Release builds therefore turn this OFF — CI has Xcode — via:
#
#     cargo build --release --no-default-features
#
# See ADR-0002 for the full trade-off.
default = ["runtime-shaders"]
runtime-shaders = ["gpui/runtime_shaders"]

[dependencies]
libc = "0.2"
elle-core.workspace = true
elle-text.workspace = true
elle-syntax.workspace = true
elle-workspace.workspace = true
elle-laravel.workspace = true
elle-git.workspace = true
elle-index.workspace = true
elle-db.workspace = true
elle-docker.workspace = true
elle-lsp.workspace = true
elle-plugin.workspace = true
elle-debug.workspace = true
elle-settings.workspace = true
elle-terminal.workspace = true
elle-test-runner.workspace = true
elle-theme.workspace = true

gpui.workspace = true
anyhow.workspace = true
# The async channel that carries test events from the background run to the panel (#25).
#
# Not a new dependency in any meaningful sense: `smol` is already declared in the workspace
# and its `async-channel` is already compiled for every build through gpui's own executor.
# The alternative was `std::sync::mpsc` plus a timer to poll it, which is exactly the idle
# cost #79 and #93 exist to keep out — a channel that wakes the task when an event arrives
# costs nothing when no run is happening.
smol.workspace = true
notify.workspace = true
# Reads GitHub's releases/latest response for the self-updater. Already compiled for
# every build through the settings crate — declaring it here adds nothing new.
serde_json.workspace = true
regex.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true

# The preview pane (#31), and nowhere else — see ADR-0011 for why a webview is allowed
# here and refused everywhere else.
#
# WebKit is a system framework, dynamically linked, so these three cost approximately
# nothing in the binary: measured 18.86 MB → 18.85 MB with a real WKWebView constructed.
# Only the bindings are linked; the engine already lives on the machine.
objc2 = "0.6.4"
objc2-web-kit = { version = "0.3.2", features = ["WKWebViewConfiguration", "WKNavigation"] }
objc2-foundation = { version = "0.3.2", features = ["NSURL", "NSURLRequest"] }
# CGRect/CGPoint/CGSize, which is where the frame arithmetic lands.
objc2-core-foundation = { version = "0.3.2", features = ["CFCGTypes"] }
objc2-app-kit = { version = "0.3.2", features = ["NSView", "NSWindow", "NSResponder"] }
# The one public seam GPUI 0.2.2 offers onto its NSView (it implements HasWindowHandle but
# does not re-export the crate, so the version must match gpui's own 0.6 or the trait will
# not resolve). Already in the lock via gpui — this declares what is already compiled.
raw-window-handle = "0.6"

[dev-dependencies]
rusqlite = { version = "0.37", features = ["bundled"] }
# gpui's own test harness, which can open a window and run a full layout/paint pass with no
# display attached. That is the only way a machine can check that a view renders at all
# rather than merely that its inputs were computed correctly (issue #35).
#
# It was previously believed unusable here because the feature pulls in `wayland` and `x11`.
# It does pull them in — and it compiles and runs on macOS anyway, verified before adding it.
gpui = { version = "0.2.2", features = ["runtime_shaders", "test-support"] }
# Real files on a real disk, for the save round-trip tests. Asserting on `text_for_save`
# alone would not catch a `read_file`/`write_file` pair that reshapes the bytes.
tempfile = "3"
