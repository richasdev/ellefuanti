[package]
name = "ellefuanti"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "A native, GPU-accelerated IDE built for PHP, Laravel, Livewire and Blade"

[[bin]]
name = "ellefuanti"
path = "src/main.rs"

[features]
# Compile Metal shaders at runtime instead of at build time.
#
# On by default because the alternative requires **full Xcode**: gpui's build script shells
# out to `xcrun metal`, which the Command Line Tools do not ship, and the build fails
# outright without it. Defaulting to buildability means `cargo build` works on a fresh
# checkout with no 40 GB install.
#
# The cost is startup: compiling shaders at launch is ~432 ms on a cold shader cache, which
# is most of the 520 ms cold start recorded in benchmarks/BASELINE.md against a 500 ms
# budget. Release builds therefore turn this OFF — CI has Xcode — via:
#
#     cargo build --release --no-default-features
#
# See ADR-0002 for the full trade-off.
default = ["runtime-shaders"]
runtime-shaders = ["gpui/runtime_shaders"]

[dependencies]
elle-core.workspace = true
elle-text.workspace = true
elle-syntax.workspace = true
elle-workspace.workspace = true
elle-terminal.workspace = true

gpui.workspace = true
anyhow.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true

[dev-dependencies]
# gpui's own test harness, which can open a window and run a full layout/paint pass with no
# display attached. That is the only way a machine can check that a view renders at all
# rather than merely that its inputs were computed correctly (issue #35).
#
# It was previously believed unusable here because the feature pulls in `wayland` and `x11`.
# It does pull them in — and it compiles and runs on macOS anyway, verified before adding it.
gpui = { version = "0.2.2", features = ["runtime_shaders", "test-support"] }
# Real files on a real disk, for the save round-trip tests. Asserting on `text_for_save`
# alone would not catch a `read_file`/`write_file` pair that reshapes the bytes.
tempfile = "3"
