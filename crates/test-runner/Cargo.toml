[package]
name = "elle-test-runner"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
anyhow.workspace = true
# Killing the *process group*, which std's Child::kill cannot do. Already compiled for
# every build (gpui and half the tree depend on it); the alternative was leaving a
# cancelled suite's grandchildren running and holding the output pipes — the CI-caught
# 30-second cancel.
libc = "0.2"

[dev-dependencies]
# Detection answers "is there a runner in this project", so the tests have to build trees
# that really do and really do not have one. Asserting on the command this *would* build
# proves only that string joining works — the whole point is the `is_file` check.
tempfile = "3"
