name: Release

on:
  push:
    tags: ["v*"]
  # Manual runs are for rehearsing the workflow without minting a tag, which is the only
  # way to find a broken release pipeline before it matters.
  workflow_dispatch:

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always

jobs:
  release:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v5

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          # Both slices of the universal binary. macos-latest runners are arm64, so
          # x86_64 is a cross-compile and its std has to be installed explicitly.
          targets: aarch64-apple-darwin, x86_64-apple-darwin

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2

      # Gate the release on the tests. A tag is not a promise that something compiles.
      - name: Test
        run: cargo test --workspace

      # --no-default-features drops runtime_shaders, so shaders are compiled here rather
      # than on the user's machine at every launch. This runner has full Xcode; that is the
      # whole reason the release build differs from the local one (ADR-0002).
      #
      # Built once per architecture and merged below, so the release runs on Intel Macs as
      # well as Apple Silicon. Each target is named explicitly rather than relying on the
      # host default, because `--target` changes the output path and a bare build would
      # land in target/release/ where the merge step could mistake it for a slice.
      - name: Build release (arm64)
        run: cargo build --release -p ellefuanti --no-default-features --target aarch64-apple-darwin

      - name: Build release (x86_64)
        run: cargo build --release -p ellefuanti --no-default-features --target x86_64-apple-darwin

      # `lipo` merges the two Mach-O files into one fat binary that macOS picks the right
      # slice from at launch. It must happen BEFORE bundle-macos.sh, because that script
      # ad-hoc-signs the bundle last and signing seals the executable as it is — lipo-ing
      # afterwards would invalidate the signature and reproduce the "damaged app" failure
      # the signing exists to prevent.
      - name: Merge into a universal binary
        run: |
          set -euo pipefail
          mkdir -p target/release
          lipo -create \
            target/aarch64-apple-darwin/release/ellefuanti \
            target/x86_64-apple-darwin/release/ellefuanti \
            -output target/release/ellefuanti

          # Assert rather than trust: a lipo that silently produced one slice would ship an
          # arm64-only app named "universal", which is worse than shipping it named arm64.
          lipo -info target/release/ellefuanti
          for arch in arm64 x86_64; do
            lipo -info target/release/ellefuanti | grep -q "$arch" \
              || { echo "the $arch slice is missing from the universal binary" >&2; exit 1; }
          done

      - name: Package
        id: package
        run: |
          set -euo pipefail
          VERSION="${GITHUB_REF_NAME#v}"
          # workflow_dispatch has no tag, so fall back to something identifiable rather
          # than producing an artifact named after a branch.
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            VERSION="dev-${GITHUB_SHA::7}"
          fi
          # "universal", not `uname -m`: the runner's own architecture says nothing about
          # what is in the artifact now that it carries both. `uname -m` would have named a
          # universal build "arm64" and told Intel users the one thing that would stop them
          # downloading the release that finally runs for them.
          NAME="ellefuanti-${VERSION}-macos-universal"

          mkdir -p "dist/${NAME}"
          # Ship the .app, not the bare binary: it is what carries the icon, and it is what
          # a user can actually drag to /Applications.
          python3 scripts/gen-iconset.py
          scripts/bundle-macos.sh target/release/ellefuanti "dist/${NAME}"
          cp README.md LICENSE "dist/${NAME}/"

          # Gatekeeper will block an unsigned binary downloaded from the internet. Saying so
          # in the archive is more honest than letting the user discover it as a crash.
          cat > "dist/${NAME}/RUNNING.md" <<'EOF'
          # Running ellefuanti

          This build is **not code-signed or notarised**, so macOS Gatekeeper will refuse to
          open it on first launch. That is expected for a 0.1.0 development release.

          To run it anyway:

          ```sh
          xattr -d com.apple.quarantine ./ellefuanti
          ./ellefuanti
          ```

          Only do that because you trust where this archive came from. Signing and
          notarisation need an Apple Developer account and are deliberately out of scope for
          this release — see the release notes.
          EOF

          # The .dmg is what the README and the installer actually hand people; the .zip
          # is the archive. Built here rather than by hand after the fact, because "by
          # hand after the fact" is how a release ships without one.
          scripts/dmg-macos.sh "${VERSION}" "dist/${NAME}"

          # TWO names, deliberately. The versioned one is what release notes link. The
          # stable one is what scripts/install.sh fetches through
          # /releases/latest/download/ — a URL that cannot carry a version, or the
          # installer would rot the moment the next release ships. Miss this copy and the
          # README's one-line install 404s for everyone.
          cp "target/ellefuanti-v${VERSION}-macos.dmg" "dist/ellefuanti-macos.dmg"
          cp "target/ellefuanti-v${VERSION}-macos.dmg" "dist/ellefuanti-v${VERSION}-macos.dmg"

          # Prove the bundle is well-formed *before* publishing it — "damaged and can't be
          # opened" shipped three times, and every instance was invisible to cargo test.
          #
          # Each line below was checked against a deliberately broken bundle, so none of
          # them is decoration:
          #
          #   - Contents/_CodeSignature/ deleted → `-dv` prints "Sealed Resources=none" and
          #     --verify exits 1 with "invalid resource directory". Both catch it; the
          #     explicit `test -d` leads anyway because it names the fault in one line
          #     instead of making the next reader decode a codesign message.
          #   - a resource edited after signing → --verify: "a sealed resource is missing or
          #     invalid". This is what enforces bundle-macos.sh's sign-LAST rule.
          #
          # One piece of local folklore did NOT reproduce on macOS 15: `cp -R` preserved
          # _CodeSignature/ here. `ditto` stays in dmg-macos.sh — it is still the right tool
          # for xattrs and resource forks — but cp is not proven to be the mechanism behind
          # the "damaged" bundles that shipped, and the comment there overstates the case.
          test -d "dist/${NAME}/ellefuanti.app/Contents/_CodeSignature" \
            || { echo "no _CodeSignature/ — macOS will call this bundle damaged" >&2; exit 1; }
          codesign -dv --verbose=2 "dist/${NAME}/ellefuanti.app" 2>&1 | grep -q "Info.plist entries=" \
            || { echo "Info.plist not bound — malformed bundle, refusing to publish" >&2; exit 1; }
          codesign -dv --verbose=2 "dist/${NAME}/ellefuanti.app" 2>&1 | grep -q "Sealed Resources version=" \
            || { echo "resources not sealed — malformed bundle, refusing to publish" >&2; exit 1; }
          # Catches a resource changed after signing — the "sign last" rule's enforcement.
          codesign --verify --deep --strict "dist/${NAME}/ellefuanti.app"

          cd dist && zip -r "${NAME}.zip" "${NAME}" >/dev/null
          echo "artifact=dist/${NAME}.zip" >> "$GITHUB_OUTPUT"
          echo "appdir=dist/${NAME}" >> "$GITHUB_OUTPUT"
          echo "name=${NAME}" >> "$GITHUB_OUTPUT"
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"

      # Verify the .app that actually ships, not the loose binary lipo produced. The two
      # can differ: bundle-macos.sh copies the executable and then signs the bundle, and a
      # signature that failed to seal is invisible until a user downloads it and macOS
      # calls the app damaged. Checking here is the only place that failure is cheap.
      - name: Verify the bundled app
        run: |
          set -euo pipefail
          APP="${{ steps.package.outputs.appdir }}/ellefuanti.app"
          EXE="$APP/Contents/MacOS/ellefuanti"

          # Both slices survived the copy into the bundle.
          file "$EXE"
          lipo -info "$EXE"
          for arch in arm64 x86_64; do
            lipo -info "$EXE" | grep -q "$arch" \
              || { echo "the $arch slice did not survive bundling" >&2; exit 1; }
          done

          codesign --verify --deep --strict "$APP"

          # Per-slice, because macOS only validates the slice it is about to run: an
          # unsigned x86_64 slice inside an otherwise-valid bundle would pass every check
          # above and then show as "damaged" on Intel Macs and nowhere else — invisible to
          # anyone verifying the release on Apple Silicon.
          for arch in arm64 x86_64; do
            codesign -dv --verbose=2 --arch "$arch" "$APP" 2>&1 | grep -q 'Signature=adhoc' \
              || { echo "the $arch slice is not signed" >&2; exit 1; }
          done

          # `Info.plist=not bound` / `Sealed Resources=none` is the malformed state that
          # makes macOS say "damaged" — assert the positive rather than eyeball the log.
          codesign -dv --verbose=2 "$APP" 2>&1 | tee /tmp/codesign.txt
          grep -q 'Info.plist entries=' /tmp/codesign.txt \
            || { echo "Info.plist is not bound into the signature" >&2; exit 1; }
          grep -q 'Sealed Resources version=' /tmp/codesign.txt \
            || { echo "Resources are not sealed" >&2; exit 1; }

      - name: Upload artifact
        uses: actions/upload-artifact@v5
        with:
          name: ${{ steps.package.outputs.name }}
          path: ${{ steps.package.outputs.artifact }}

      # Only a real tag becomes a GitHub release; a dispatch run stops at the artifact.
      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            ${{ steps.package.outputs.artifact }}
            dist/ellefuanti-macos.dmg
            dist/ellefuanti-v${{ steps.package.outputs.version }}-macos.dmg
          body_path: CHANGELOG.md
          # NOT a prerelease, and this is load-bearing rather than cosmetic. GitHub
          # excludes prereleases when it resolves `releases/latest`, and that URL is
          # what the README's download button points at *and* what the in-app updater
          # polls. Tagging 0.2.0 through 0.3.0 as prereleases left both of them serving
          # 0.1.0: a new user downloaded a version three releases old, and nobody was
          # ever offered an update. The 0.1.0-era caveat this inherited (#35's
          # unverified rendering) no longer justifies breaking the install path.
          prerelease: false
          make_latest: true
          fail_on_unmatched_files: true
