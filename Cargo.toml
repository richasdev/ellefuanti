[workspace]
resolver = "2"
members = [
    "crates/app",
    "crates/core",
    "crates/text",
    "crates/syntax",
    "crates/workspace",
    "crates/terminal",
    "crates/lsp",
    "benchmarks",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "Apache-2.0"
repository = "https://github.com/uemuradev/ellefuanti"

[workspace.dependencies]
# ellefuanti crates
elle-core = { path = "crates/core" }
elle-text = { path = "crates/text" }
elle-syntax = { path = "crates/syntax" }
elle-workspace = { path = "crates/workspace" }
elle-terminal = { path = "crates/terminal" }
elle-lsp = { path = "crates/lsp" }

# UI. The runtime_shaders feature is selected by crates/app, not here, so a release build
# can turn it off and precompile shaders instead (see ADR-0002 and crates/app/Cargo.toml).
gpui = { version = "0.2.2", default-features = true }

ropey = "1.6"
tree-sitter = "0.26"
tree-sitter-php = "0.24"
ignore = "0.4"
portable-pty = "0.9"
alacritty_terminal = "0.26"
lsp-types = "0.97"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
notify = "8"

anyhow = "1"
thiserror = "2"
smol = "2"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

[profile.dev]
# Startup and typing latency are features, not later work: unoptimized rope/tree-sitter
# is too slow to feel the product during development.
opt-level = 1

[profile.dev.package."*"]
opt-level = 2

[profile.release]
lto = "thin"
codegen-units = 1
panic = "abort"
