<?xml version="1.0" encoding="UTF-8"?>
<!-- ellefuanti app icon: the pixel-art elePHPant, square and transparent.

     Derived from a 1342x894 source whose real resolution is only 18x10 art pixels;
     this file states that grid directly, one rect per pixel.

     No background rect. macOS masks app icons itself, so an opaque fill shows up as a
     white square in the Dock fighting the system corner rounding.

     Art is 72/90 = 80% of the canvas: the Big Sur+ safe area. All coordinates are
     integers, so every whole-number render scale stays pixel-crisp.

     The .icns is NOT generated from this file; see assets/README.md. Fractionally
     resampling 18 art pixels down to a 16pt icon destroys the eyes and legs, so the
     small sizes are drawn from the same matrix at integer scale instead. -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 90 90" width="1024" height="1024" shape-rendering="crispEdges">
